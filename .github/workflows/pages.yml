# Builds the web app (app-src/) and publishes the whole site to GitHub Pages:
# the home and privacy pages at /, the web app at /app/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-src/package-lock.json
      - name: Install
        working-directory: app-src
        run: npm ci
      - name: Test
        working-directory: app-src
        run: npm test
      - name: Build
        working-directory: app-src
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp index.html privacy.html style.css _site/
          cp -R app-src/dist/. _site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
